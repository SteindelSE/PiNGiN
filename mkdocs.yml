site_name: PiNGiN
site_description: Cross-platform local-first pi-agent companion
site_url: https://pingin.dev

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - How-To Guide: how-to.md
  - Architecture: architecture.md

theme:
  name: material
  palette:
    - scheme: slate
      primary: red
      accent: red
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
