appId: dev.pingin.app
productName: PiNGiN
directories:
  output: release
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/index.html
  - dist/assets/**/*
  - node_modules/**/*
  - package.json
  - '!node_modules/**/*.md'
  - '!node_modules/**/*.ts'
  - '!node_modules/**/*.test.*'
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: build/icons/icon.png
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
  icon: build/icons/icon.icns
win:
  target:
    - nsis
    - portable
  icon: build/icons/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
